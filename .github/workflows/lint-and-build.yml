name: Lint and Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - 'webpack.config.js'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'webpack.config.js'
      - 'tsconfig.json'

# Verify-only: lints and builds the front-end to confirm it compiles. Built assets are
# NOT committed — they are generated at release time by release-assets.yml.
jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build production files (verify compilation)
        run: npm run build