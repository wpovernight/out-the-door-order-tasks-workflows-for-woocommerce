name: Lint and Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'package.json'
      - 'webpack.config.js'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'webpack.config.js'
      - 'tsconfig.json'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint with auto-fix
        run: npm run lint:fix || true

      - name: Build production files
        run: npm run build

      - name: Remove package-lock.json files if generated
        run: |
          find . -name "package-lock.json" -type f -delete

      - name: Auto committing linted and built files
        uses: stefanzweifel/git-auto-commit-action@v4
        if: github.event_name == 'push'
        with:
          commit_message: "Lint and build JS/TS assets"
          file_pattern: 'assets/js/*.js src/**'
