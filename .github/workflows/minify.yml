name: Auto Minify JS and CSS Files

on:
  workflow_dispatch:
  push:
    paths:
      - 'includes/Admin/assets/**/*.js'
      - 'includes/Admin/assets/**/*.css'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Auto Minify
        uses: alexmigf/auto-minify@exclude-dirs
        with:
          directory: 'includes/Admin/assets'
          exclude_directories: '**/build'

      - name: Auto committing minified files
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Generate minified JS and CSS files"
