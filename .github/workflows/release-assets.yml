name: Add release ZIP

on:
  release:
    types: [published]

jobs:
  create-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Set environment variables
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # process existing variables
          # The distributed plugin slug must not contain the restricted terms, like "wp"
          PLUGIN_SLUG="advanced-order-manager-for-woocommerce"
          TEXT_DOMAIN="$PLUGIN_SLUG"
          VERSION="${TAG_NAME#v}"
          ZIP_FILE_NAME=$PLUGIN_SLUG.$VERSION.zip

          # set environment variables
          echo "plugin_slug=$PLUGIN_SLUG" >> $GITHUB_ENV
          echo "text_domain=$TEXT_DOMAIN" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_ENV
          echo "zip_file_name=$ZIP_FILE_NAME" >> $GITHUB_ENV

      - name: Checkout Git repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.event.release.tag_name }}
          path: ${{ env.plugin_slug }}
          submodules: true
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build JS assets
        working-directory: ${{ env.plugin_slug }}
        run: |
          npm ci
          npm run build

      - name: Minify CSS
        working-directory: ${{ env.plugin_slug }}
        run: |
          npm install -g clean-css-cli
          # Minify each CSS source into its .min.css counterpart, in place under assets/css/.
          find assets/css -type f -name '*.css' \
            ! -name '*.min.css' \
            -exec bash -c 'cleancss -o "${0%.css}.min.css" "$0"' {} \;

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, wp-cli

      - name: Install production-only Composer dependencies
        working-directory: ${{ env.plugin_slug }}
        run: composer install --no-dev --optimize-autoloader --no-progress --prefer-dist

      # Must run after the JS build: the catalog harvests strings from the built
      # bundles in assets/js/, not from the TypeScript sources in src/.
      - name: Generate translation template
        working-directory: ${{ env.plugin_slug }}
        run: |
          wp i18n make-pot . languages/${{ env.text_domain }}.pot \
            --exclude=src,docs

      - name: Check stable version in readme.txt
        run: |
          STABLE_TAG=$(grep -oP '(?<=Stable tag: ).*' ${{ env.plugin_slug }}/readme.txt | tr -d '[:space:]')
          if [ "$STABLE_TAG" != "${{ env.version }}" ]; then
            echo "Stable tag ($STABLE_TAG) does not match release version (${{ env.version }}). Halting execution."
            exit 1
          fi

      - name: Create ZIP
        run: |
          # reformat .distignore for `zip -x`: drop comments/blank lines, strip leading slashes,
          # rewrite "dir/" -> "dir/*" so directory contents are actually excluded, then prefix
          # every pattern with the plugin slug to match the archive paths.
          sed -E "/^[[:space:]]*(#|$)/d;s#^/##;s#/\$#/*#;s#^#${{ env.plugin_slug }}/#" ${{ env.plugin_slug }}/.distignore > .zipignore

          # create zip file
          zip -rq ${{ env.zip_file_name }} ${{ env.plugin_slug }} -x@.zipignore

      - name: Add ZIP to release assets
        uses: meeDamian/github-release@2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ env.zip_file_name }}
          gzip: false
          allow_override: true
